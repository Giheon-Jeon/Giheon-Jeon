name: Update profile assets

on:
  schedule:
    - cron: "0 18 * * *" # daily at 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          curl -sL --retry 3 --fail \
            "https://github-readme-streak-stats-tau-one.vercel.app/?user=Giheon-Jeon&hide_border=true&background=ffffff&ring=000000&fire=000000&currStreakLabel=000000" \
            -o assets/streak-stats.new.svg
          if head -c 100 assets/streak-stats.new.svg | grep -q "<svg"; then
            mv assets/streak-stats.new.svg assets/streak-stats.svg
          else
            echo "Fetched file is not a valid SVG, keeping previous version."
            rm -f assets/streak-stats.new.svg
          fi

      - name: Fetch contribution graph SVG
        run: |
          curl -sL --retry 3 --fail \
            "https://ghchart.rshah.org/000000/Giheon-Jeon" \
            -o assets/contribution-graph.new.svg
          if head -c 100 assets/contribution-graph.new.svg | grep -q "<svg"; then
            mv assets/contribution-graph.new.svg assets/contribution-graph.svg
          else
            echo "Fetched file is not a valid SVG, keeping previous version."
            rm -f assets/contribution-graph.new.svg
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: update profile assets"
          git push
